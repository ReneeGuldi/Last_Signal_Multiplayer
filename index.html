<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Last Signal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <div id="hud">
        <div id="health">Health: 100</div>
        <div id="ammo">Pistol: 30</div>
        <div id="weapons"></div>
        <div id="parts">Radio parts: 0 / 3</div>
        <div id="score">Score: 0</div>
        <div id="objective"></div>
        <div id="you"></div>
        <div id="players"></div>
    </div>
    <div id="hurt"></div>
    <div id="message"></div>
    <div id="prompt"></div>
    <div id="note">
        <div id="note-text"></div>
        <div id="note-footer"><span id="note-count"></span> · Press E to close</div>
    </div>
    <div id="crosshair"></div>
    <div id="overlay">
        <h1 id="overlay-title">LAST SIGNAL</h1>
        <p id="overlay-text">Loading...</p>
        <div id="profile">
            <input id="name-input" maxlength="16" placeholder="Your name">
            <div class="pick">
                <button id="pick-female" data-model="female">Female</button>
                <button id="pick-male" data-model="male">Male</button>
            </div>
        </div>
        <div id="lobby">
            <div class="row" id="lobby-menu">
                <button id="host-btn">Host game</button>
                <span>or join:</span>
                <input id="code-input" maxlength="4" placeholder="CODE" autocomplete="off">
                <button id="join-btn">Join</button>
            </div>
            <div class="row" id="lobby-in" hidden>
                <span>Lobby code:</span> <b id="lobby-code"></b> <span id="lobby-role"></span>
                <button id="leave-btn">Leave</button>
            </div>
            <p id="lobby-status"></p>
        </div>
        <p>Move: WASD, Sprint: Shift, Jump: Space, Look Around: Mouse, Attack: Click, Shove: F<br>
        Interact / Pick up / Read: E, Weapons: 1 2 3 or Mouse Wheel</p>
        <button id="restart-btn">Restart run</button>
    </div>

<!-- Importing the map -->
 <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js",
            "socket.io-client": "https://cdn.socket.io/4.8.1/socket.io.esm.min.js"
        }
    }
 </script>
 <script type="module" src="main.js"></script>
</body>

</html>
